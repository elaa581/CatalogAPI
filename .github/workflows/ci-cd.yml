
name: CI/CD Pipeline - ProductCatalog API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1 : Continuous Integration
  # Build & Unit Tests
  # ==========================================

  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:

      # Step 1 : Récupérer le code source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 : Configurer le SDK .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3 : Restaurer les dépendances NuGet
      - name: Restore Dependencies
        run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj

      # Step 4 : Compiler le projet
      - name: Build Solution
        run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore

      # Step 5 : Exécuter les tests unitaires
            # Step 5 : Exécuter les tests unitaires
      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=UnitResults.trx"
          --results-directory ./TestResults/UnitTests
      # Step 6 : Sauvegarder le rapport des tests unitaires
      - name: Upload Unit Tests Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/UnitTests/*.trx


  # ==========================================
  # JOB 2 : Tests d'Intégration avec SQL Server
  # ==========================================

  integration-test:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest

    # Exécuter ce job uniquement si JOB 1 réussit
    needs: [unit-tests]

    # Conteneur Docker SQL Server
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password123!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6

    steps:

      # Step 1 : Récupérer le code source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 : Configurer le SDK .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3 : Restaurer les dépendances
      - name: Restore Dependencies
        run: dotnet restore tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj

      # Step 4 : Compiler le projet de tests
      - name: Build Tests
        run: dotnet build tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj --configuration Release --no-restore

      # Step 5 : Exécuter les tests d'intégration
      - name: Run Integration Tests
        env:
          ConnectionStrings__CatalogDbConnection: "Server=localhost,1433;Database=CatalogDB_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --no-build
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=IntegrationResults.trx"
          --results-directory ./TestResults/IntegrationTests
    # Step 6 : Sauvegarder le rapport des tests d'intégration
      - name: Upload Integration Tests TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/IntegrationTests/*.trx
      
      - name: Publish Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Report - Tests'
          path: './TestResults/**/*.trx'
          reporter: 'dotnet-trx'

  # ====================================================================
  # JOB 3 : Continuous Delivery (Docker Build & Push vers Docker Hub)
  # ====================================================================

  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    # Exécuter uniquement sur un push vers la branche main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Ce job attend la réussite des tests d'intégration
    needs: [integration-test]

    steps:

      # Step 1 : Récupérer le code source
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # Step 2 : Configurer Docker Buildx
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 : Connexion à Docker Hub
      - name: Connexion au registre Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4 : Extraire les métadonnées (Tags et Labels)
      - name: Extraire les métadonnées (Tags et Labels sémantiques)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/productcatalog-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      # Step 5 : Construire et publier l'image Docker
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}



